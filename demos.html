<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>הדמיות הפרויקטים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a district-grouped switcher on top, one demo stage below. Same night look as the city map; every demo uses invented data. */
:root{
  --night:#0f0b22; --plum:#1d1438; --panel:#181130; --line:rgba(220,210,255,.14);
  --cream:#f6efe4; --muted:#b4a9cc; --teal:#3fd6c8; --coral:#ff7a59; --amber:#ffc94a; --violet:#c58bff;
  --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-head:#1f2c34;
  --f-display:'Karantina','Assistant',sans-serif; --f-body:'Assistant','Segoe UI',Arial,sans-serif; --f-mono:'JetBrains Mono',Consolas,monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--f-display);font-size:56px;line-height:.85;margin:0;font-weight:700}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.demo-flag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:99px;border:1px dashed var(--amber);color:var(--amber)}
nav{display:grid;gap:10px;margin:22px 0 18px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp b{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--gc);min-width:86px}
.grp button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:14px}
.grp button[aria-current="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 18%,transparent);color:var(--cream)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:560px}
.stage h2{margin:0;font-family:var(--f-display);font-size:42px;font-weight:700;line-height:.9;color:var(--sc)}
.stage .lead{margin:6px 0 18px;color:var(--muted);max-width:66ch}
.view[hidden]{display:none}
.row2{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.btn{padding:9px 16px;border-radius:12px;border:0;background:var(--sc,var(--teal));color:#111;font-weight:800}
.ghost{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600}
.note{font-size:13px;color:var(--muted)}

/* phone frame */
.phone{width:min(330px,100%);height:600px;border-radius:38px;padding:12px;background:#05040b;border:1px solid #2c2440;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.screen{flex:1;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:#f4f2f8;color:#1c1830;min-height:0;position:relative}
.screen.dark{background:var(--wa-bg);color:#e9edef}
/* whatsapp */
.wa-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--wa-head);color:#e9edef}
.wa-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;flex:none}
.wa-head b{display:block;font-size:15px}.wa-head span{font-size:12px;color:#8696a0}
.wa-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:#0b141a radial-gradient(circle at 20% 20%,rgba(255,255,255,.03) 0 2px,transparent 3px) 0 0/22px 22px}
.msg{max-width:82%;padding:7px 10px 18px;border-radius:10px;font-size:14px;line-height:1.45;position:relative;white-space:pre-line;animation:pop .25s ease-out}
.msg.in{align-self:flex-start;background:var(--wa-in);border-top-right-radius:2px}
.msg.out{align-self:flex-end;background:var(--wa-out);border-top-left-radius:2px}
.msg time{position:absolute;bottom:3px;left:8px;font-size:10px;color:#8696a0}
.msg .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.typing{align-self:flex-start;background:var(--wa-in);padding:10px 12px;border-radius:10px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#8696a0;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:#111b21;border-top:1px solid #222d34}
.qr button{padding:7px 12px;border-radius:99px;border:1px solid #00a884;background:transparent;color:#00a884;font-weight:700;font-size:13px}
.wa-foot{padding:8px 10px;background:#111b21;color:#8696a0;font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.typing i{animation:none}}

/* app ui inside phone (light) */
.app-top{padding:14px 16px 10px;background:#1c1830;color:#fff}
.app-top small{color:#b8b0d6;font-size:12px}
.app-top b{display:block;font-size:19px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.tile{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile b{display:block;font-family:var(--f-display);font-size:34px;line-height:.9;font-weight:700}
.tile span{font-size:12px;color:#6a6488}
.list{padding:0 12px 12px;display:grid;gap:8px;overflow-y:auto}
.li{background:#fff;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.li small{display:block;color:#6a6488;font-size:12px}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:#d9f7ef;color:#0b7a62}.chip.wait{background:#fff1cf;color:#8a6200}.chip.new{background:#e7ddff;color:#5b34b8}
.seg{display:flex;margin:10px 12px 0;background:#e6e2f2;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:9px;font-weight:700;font-size:13px;color:#4b456a}
.seg button[aria-pressed="true"]{background:#fff;color:#1c1830}

/* payment page */
.pay{padding:18px;display:grid;gap:12px}
.pay .brand{font-weight:800;font-size:16px}
.pay .sum{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pay .sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.pay .sum .tot{border-top:1px solid #eee;margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.pay .card{background:linear-gradient(135deg,#2b2350,#4b3b8a);color:#fff;border-radius:14px;padding:14px;font-family:var(--f-mono);font-size:14px}
.pay .paybtn{border:0;border-radius:14px;padding:14px;background:#0b7a62;color:#fff;font-weight:800;font-size:16px}
.pay .ok{text-align:center;padding:30px 10px}
.pay .ok .big{font-size:56px}
.lock{font-size:12px;color:#6a6488;text-align:center}

/* ops monitor */
.ops{display:grid;gap:14px;width:100%;max-width:820px}
.ops .tiles{padding:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ops .tile{background:#221a3e;color:var(--cream)}
.ops .tile span{color:var(--muted)}
.ops .tile.good b{color:var(--teal)}
.beat{height:60px;width:100%;background:#120d26;border-radius:12px;border:1px solid var(--line)}
.log{background:#120d26;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;direction:rtl}
.log div{display:flex;gap:10px;animation:pop .3s ease-out}
.log time{color:var(--muted);direction:ltr;flex:none}
.log .ok{color:var(--teal)}.log .warn{color:var(--amber)}.log .bad{color:var(--coral)}

/* ultra */
.ultra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;width:100%}
@media (max-width:760px){.ultra{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl tr{cursor:pointer}.tbl tr.sel td{background:rgba(63,214,200,.1)}
.week{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:3px;font-size:12px}
.week .h{color:var(--muted);text-align:center;padding:4px 0}
.week .t{color:var(--muted);font-family:var(--f-mono);font-size:11px;padding-top:6px}
.week .c{min-height:34px;border-radius:8px;background:rgba(255,255,255,.03)}
.week .c.l{background:color-mix(in srgb,var(--teal) 30%,transparent);border:1px solid var(--teal);padding:4px 6px;font-weight:700}
.week .c.l.hi{background:var(--teal);color:#06231f}
.detail{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--teal)}

/* watchdog */
.wd{display:grid;gap:14px;width:100%;max-width:760px}
.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bot{border-radius:16px;padding:16px;border:1px solid var(--line);background:#1a1336;display:grid;gap:6px;transition:border-color .3s,background .3s}
.bot b{font-size:18px}.bot .st{font-weight:800}
.bot.up .st{color:var(--teal)}.bot.down{border-color:var(--coral);background:#2a1022}.bot.down .st{color:var(--coral)}.bot.fix{border-color:var(--amber)}.bot.fix .st{color:var(--amber)}
.lighthouse{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:#120d26;border:1px solid var(--line)}
.lh-lamp{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff6c8,#ffb020 55%,transparent 70%);flex:none;animation:sweep 2s linear infinite}
@keyframes sweep{50%{opacity:.35;transform:scale(.8)}}
.stopwatch{font-family:var(--f-display);font-size:48px;line-height:.9;color:var(--amber)}

/* lectures */
.lec{display:grid;gap:14px;width:100%;max-width:820px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.file{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:#221a3e;font-weight:700}
.steps{display:grid;gap:8px}
.step{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.step i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.step.on{color:var(--cream)}.step.on i{border-color:var(--teal);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--cream)}.step.done i{background:var(--teal);border-color:var(--teal);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700}
.tabs button[aria-pressed="true"]{border-color:var(--coral);color:var(--coral)}
.out{border:1px solid var(--line);border-radius:16px;padding:16px;background:#150f2c;min-height:240px}
.q{margin-bottom:14px}.q p{margin:0 0 6px;font-weight:700}
.q button{display:block;width:100%;text-align:start;margin:4px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.q button.right{border-color:var(--teal);background:rgba(63,214,200,.15)}.q button.wrong{border-color:var(--coral);background:rgba(255,122,89,.12)}
.slides{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.slide{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#2a2150,#3b2a6e);padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px}
.slide b{font-size:16px}
.mail{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(63,214,200,.1);border:1px solid var(--teal);font-size:14px}

/* motion */
.reel{width:100%;max-width:820px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;position:relative;background:#111;isolation:isolate}
.reel canvas{position:absolute;inset:0;width:100%;height:100%}
.reel .cap{position:absolute;bottom:10px;inset-inline-start:12px;font-size:12px;color:rgba(255,255,255,.7);z-index:3}
.scene{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.kin{font-family:var(--f-display);font-weight:700;color:#fff;text-align:center;line-height:.85}
.price-line{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--violet) 50%,transparent);background:rgba(197,139,255,.08);font-weight:600}
</style>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <h1>הדמיות הפרויקטים</h1>
    <p>איך הפרויקטים מהעיר נראים כשמשתמשים בהם. כל מסך כאן אינטראקטיבי: אפשר ללחוץ, לשלוח ולראות מה קורה.</p>
    <span class="demo-flag">הדמיה · ההודעות, הלקוחות והמספרים לדוגמה</span>
  </header>
  <nav id="nav" aria-label="הדמיות לפי שכונה"></nav>
  <main class="stage" id="stage"></main>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)){ if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); }
  kids.flat().forEach(k => k != null && e.append(k.nodeType ? k : document.createTextNode(k))); return e; };
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 150) : ms));
let runId = 0;   // bumps when the view changes, so running scripts stop
const alive = id => id === runId;
const clock = (() => { let m = 20*60 + 41; return () => { m++; return `${String(Math.floor(m/60) % 24).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`; }; })();

/* ---------- whatsapp chat engine ---------- */
function chatUI({name, sub, avatar, color, group = false}){
  const body = h('div', {class:'wa-body'}), qr = h('div', {class:'qr'}), foot = h('div', {class:'wa-foot'}, 'הדמיה של שיחת וואטסאפ');
  const phone = h('div', {class:'phone'}, h('div', {class:'screen dark'},
    h('div', {class:'wa-head'}, h('div', {class:'wa-av', style:`background:${color}`}, avatar), h('div', {}, h('b', {}, name), h('span', {}, sub))), body, qr, foot));
  qr.hidden = true;
  const add = (side, text, who) => { const m = h('div', {class:'msg ' + side}, who && group ? h('span', {class:'who', style:`color:${who[1]}`}, who[0]) : null, text, h('time', {}, clock())); body.append(m); body.scrollTop = body.scrollHeight; return m; };
  const typing = async (ms, id) => { const t = h('div', {class:'typing'}, h('i'), h('i'), h('i')); body.append(t); body.scrollTop = body.scrollHeight; await wait(ms); t.remove(); return alive(id); };
  const ask = (options) => new Promise(res => { qr.innerHTML = ''; qr.hidden = false; options.forEach(o => qr.append(h('button', {onclick:() => { qr.hidden = true; res(o); }}, o))); });
  return {phone, add, typing, ask, clear:() => { body.innerHTML = ''; qr.hidden = true; }};
}
async function bot(c, id, text, who){ if (!await c.typing(400 + Math.min(1800, text.length * 18), id)) return false; c.add('in', text, who); return true; }

/* ---------- demos ---------- */
const DEMOS = {
  sys:{label:'מערכות', color:'#3fd6c8', items:{
    server:{title:'דף התשלום של התלמיד', lead:'תלמיד חדש נרשם ב"ברוש" ומקבל SMS עם קישור חתום. ככה נראה הדף שנפתח לו בטלפון.', run:serverDemo},
    phones:{title:'מנהל ומורה בטלפון', lead:'המנהל רואה את מצב בית הספר, וכל מורה רואה את השיעורים שלו. נפתח מהדפדפן, בלי חנות אפליקציות.', run:phonesDemo},
    ops:{title:'מוניטור תפעול', lead:'יומן אירועים חי ובדיקת דופק חיצונית. כשמשהו משתבש, רואים כאן מה קרה ומתי.', run:opsDemo},
    ultra:{title:'צמרת אולטרה', lead:'ספר תלמידים ויומן שיעורים במקום אחד. לחיצה על תלמיד מדגישה את השיעורים שלו ביומן.', run:ultraDemo},
  }},
  bot:{label:'בוטים', color:'#ff7a59', items:{
    melave:{title:'עמית, בוט המלווה', lead:'מישהו רוצה לבנות סוכן AI ראשון. עמית מלווה אותו צעד אחרי צעד בוואטסאפ. אפשר לבחור תשובות.', run:melaveDemo},
    inzobot:{title:'אינזו-בוט', lead:'קבוצת ההפקה של הפסטיבל: הבוט עונה על שאלות לפי מסמכי הדרייב ושולח סיכום יומי.', run:inzoDemo},
    watchdog:{title:'שומר הבוטים', lead:'לוחצים על "להפיל בוט" ורואים איך השומר מזהה את הנפילה ומרים אותו מחדש.', run:watchdogDemo},
    lectures:{title:'בוט תוכן למרצים', lead:'מרצה מעלה חומר של שיעור, והבוט מחזיר חידון, מפת חשיבה ומצגת, ושולח מייל כשהכל מוכן.', run:lecturesDemo},
    bizbots:{title:'בוט לעסק', lead:'לקוח של מספרה קובע תור בוואטסאפ. לחצו על הכפתורים כמו לקוח.', run:bizDemo},
  }},
  anim:{label:'אנימציה', color:'#c58bff', items:{
    motion:{title:'Motion Studio', lead:'אנימציה שנכתבת בקוד, עם טקסט בעברית מימין לשמאל. כמה מהסגנונות של הסטודיו, מתנגנים כאן בזמן אמת.', run:motionDemo},
    motionbiz:{title:'מושן גרפיקס לעסקים', lead:'דוגמה לפתיח של 10 שניות לעסק מומצא, כמו שמקבלים בהזמנה.', run:motionBizDemo},
  }},
};
const nav = $('#nav'), stage = $('#stage'), flat = {};
for (const [gk, g] of Object.entries(DEMOS)){
  const row = h('div', {class:'grp', style:`--gc:${g.color}`}, h('b', {}, g.label));
  for (const [k, d] of Object.entries(g.items)){ flat[k] = Object.assign(d, {color:g.color}); row.append(h('button', {'data-k':k, onclick:() => show(k)}, d.title)); }
  nav.append(row);
}
function show(k){
  const d = flat[k] || flat.server; runId++;
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.k === k ? 'true' : 'false'));
  stage.style.setProperty('--sc', d.color); stage.innerHTML = '';
  stage.append(h('h2', {}, d.title), h('p', {class:'lead'}, d.lead));
  const box = h('div', {}); stage.append(box); d.run(box, runId);
}

/* --- systems --- */
function phoneLight(...kids){ return h('div', {class:'phone'}, h('div', {class:'screen'}, ...kids)); }
function serverDemo(box, id){
  const screen = h('div', {class:'pay'});

/* --- animation: a live reel, drawn on canvas in real time --- */
function reelBox(caption){ const cv = h('canvas'), sc = h('div', {class:'scene'}), wrap = h('div', {class:'reel'}, cv, sc, h('div', {class:'cap'}, caption)); return {wrap, cv, sc}; }
function fit(cv){ const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; return [cv.width, cv.height, d]; }
function motionDemo(box, id){
  const {wrap, cv, sc} = reelBox('Motion Studio · מתנגן בזמן אמת בדפדפן');
  box.append(h('div', {class:'row2'}, wrap), h('p', {class:'note', style:'margin-top:12px'}, 'שלוש סצנות מתוך סגנונות הסטודיו: כותרת ענק על רקע צבעוני, מילה שמתפרקת לחלקיקים, וטבעת של טקסט שמסתובבת.'));
  const g = cv.getContext('2d'); let W, H, D; const resize = () => [W, H, D] = fit(cv); resize(); addEventListener('resize', resize);
  const words = ['רעיון', 'הופך', 'לתנועה'];
  // particles for the word scene
  function sample(text){ const o = document.createElement('canvas'); o.width = 600; o.height = 200; const x = o.getContext('2d'); x.fillStyle = '#fff'; x.font = '700 150px Karantina, Assistant, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.direction = 'rtl'; x.fillText(text, 300, 105);
    const d = x.getImageData(0, 0, 600, 200).data, p = []; for (let y=0;y<200;y+=4) for (let xx=0;xx<600;xx+=4) if (d[(y*600+xx)*4+3] > 128) p.push([xx/600, y/200]); return p; }
  let pts = null; const t0 = performance.now();
  (function frame(){ if (!alive(id)) return removeEventListener('resize', resize);
    const t = ((performance.now() - t0) / 1000) % 12, scene = Math.floor(t / 4), k = (t % 4) / 4;
    sc.innerHTML = '';
    if (scene === 0){ const cols = ['#ff7a59','#ffc94a','#3fd6c8']; g.fillStyle = cols[Math.min(2, Math.floor(k * 3))]; g.fillRect(0, 0, W, H);
      const i = Math.min(2, Math.floor(k * 3)), kk = (k * 3) % 1, e = 1 - Math.pow(1 - Math.min(1, kk * 2.2), 3);
      sc.append(h('div', {class:'kin', style:`font-size:${Math.round(W/D*0.2)}px;transform:translateY(${(1-e)*40}px) scale(${0.85 + e*0.15});opacity:${Math.min(1, kk*3)};color:#14102a`}, words[i])); }
    if (scene === 1){ g.fillStyle = '#0f0b22'; g.fillRect(0, 0, W, H); if (!pts) pts = sample('חלקיקים');
      const burst = Math.max(0, (k - 0.45) / 0.55), ease = burst * burst;
      g.fillStyle = '#c58bff'; pts.forEach(([x, y], i) => { const a = (i * 2.399) % (Math.PI*2), r = ease * (0.2 + (i % 7) / 7) * W * 0.6;
        const px = W * 0.1 + x * W * 0.8 + Math.cos(a) * r, py = H * 0.25 + y * H * 0.5 + Math.sin(a) * r - ease * H * 0.1;
        g.globalAlpha = 1 - ease * 0.8; g.fillRect(px, py, 2.4 * D, 2.4 * D); }); g.globalAlpha = 1; }
    if (scene === 2){ g.fillStyle = '#14102a'; g.fillRect(0, 0, W, H); const cx = W/2, cy = H/2, R = Math.min(W, H) * 0.33, txt = 'סטודיו · אנימציה · בקוד · בעברית · ';
      g.save(); g.translate(cx, cy); g.rotate(-k * Math.PI * 1.2); g.fillStyle = '#ffc94a'; g.font = `700 ${Math.round(H*0.075)}px Karantina, Assistant, sans-serif`; g.textAlign = 'center';
      const chars = [...txt]; chars.forEach((ch, i) => { g.save(); g.rotate(-i / chars.length * Math.PI * 2); g.fillText(ch, 0, -R); g.restore(); }); g.restore();
      sc.append(h('div', {class:'kin', style:`font-size:${Math.round(W/D*0.09)}px;color:#f6efe4`}, 'Motion', h('br'), 'Studio')); }
    requestAnimationFrame(frame); })();
}
function motionBizDemo(box, id){

    requestAnimationFrame(frame); })();
