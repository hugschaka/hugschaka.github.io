<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הדמיות הפרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a district-grouped switcher on top, one demo video below. Same night look as the city map.
   Every video is rendered from the project's own UI and files, with invented demo data. */
:root{
  --night:#0f0b22; --panel:#181130; --line:rgba(220,210,255,.14);
  --cream:#f6efe4; --muted:#b4a9cc; --amber:#ffc94a;
  --f-display:'Karantina','Assistant',sans-serif; --f-body:'Assistant','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-size:56px;line-height:.85;margin:0;font-weight:700}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;white-space:nowrap}
.back:hover{color:var(--cream)}
nav{display:grid;gap:10px;margin:22px 0 18px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp b{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--gc);min-width:86px}
.grp button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:14px}
.grp button[aria-current="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 18%,transparent)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.stage h2{margin:0;font-family:var(--f-display);font-size:42px;font-weight:700;line-height:.9;color:var(--sc)}
.stage .lead{margin:6px 0 16px;color:var(--muted);max-width:70ch}
video{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;background:#0b0b10}
.cta{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:99px;background:#25d366;color:#08311a;font-weight:800;text-decoration:none}
.cta:hover{filter:brightness(1.08)}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:600px){ header h1{font-size:44px} .stage{padding:14px} .stage h2{font-size:34px} }
</style></head><body>
<div class="wrap" dir="rtl">
  <header>
    <div>
      <h1>הדמיות הפרויקטים</h1>
      <p>סרטון קצר לכל פרויקט, מהמסכים ומהקבצים של הפרויקט עצמו. השמות, הטלפונים והמספרים בסרטונים מומצאים.</p>
    </div>
    <a class="back" href="index.html">חזרה לעיר ←</a>
  </header>
  <nav id="nav" aria-label="הדמיות לפי שכונה"></nav>
  <main class="stage" id="stage"></main>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const DEMOS = {
  sys:{label:'מערכות', color:'#3fd6c8', items:{
    tzameret:{title:'צמרת', lead:'מהרישום בברוש ועד סיום קליטה בבית הספר: המערכת מושכת תלמידים חדשים, שולחת להם קישור לתשלום ומעדכנת את הסטטוס לבד.'},
    server:{title:'השרת המרכזי ודף התשלום', lead:'שרת אחד לכל בתי הספר: קישור אישי וחתום ב-SMS, דף תשלום בטלפון, סליקה של בית הספר וחשבונית אוטומטית.'},
    phones:{title:'מנהל ומורה בטלפון', lead:'המנהל רואה את כל בית הספר, וכל מורה מקבל דשבורד משלו עם התראות, קאשבק ויומן. מתקינים מהדפדפן, בלי חנות אפליקציות.'},
    ops:{title:'מוניטור התפעול', lead:'יומן אירועים מכל מחשב של בית ספר ובדיקת דופק חיצונית כל 10 דקות. כשמשהו קורה, התשובה נמצאת ביומן.'},
    ultra:{title:'צמרת אולטרה', lead:'כרטיס תלמיד ויומן שיעורים בתוך צמרת: התראות על תוקף בדיקות מברוש, קביעת שיעור ורישום שיעור שבוצע.'},
    lectures:{title:'אשכול', lead:'פלטפורמה למרצים: המרצה מעלה שיעור, Claude ו-NotebookLM מפיקים ממנו חומרי לימוד, והמרצה מאשר לפני שהסטודנטים רואים.'},
  }},
  bot:{label:'בוטים', color:'#ff7a59', items:{
    melave:{title:'עמית, בוט המלווה', lead:'מלווה בוואטסאפ לבניית שכבת ההקשר וסוכני AI, צעד אחד בכל פעם לפי תוכנית הלימודים. הזיכרון מגודר: לכל משתמש תיק משלו.', cta:{label:'לשיחה אמיתית עם עמית בוואטסאפ · חינם ↗', url:'https://wa.me/972539560143'}},
    inzobot:{title:'אינזו-בוט', lead:'עוזר ההפקה של אינזואגדה בקבוצת הוואטסאפ: עונה רק כשמתייגים אותו, מתוך מסמכי הדרייב שמסתנכרנים כל 20 דקות.'},
    watchdog:{title:'שומר הבוטים', lead:'משימה מתוזמנת שבודקת את הבוטים כל 5 דקות, מרימה בוט שנפל ומתריעה בוואטסאפ דרך הבוט שחי.'},
    bizbots:{title:'בוט לעסק', lead:'בוט וואטסאפ לעסק קטן על ה-API הרשמי של WhatsApp Business: עונה ללקוחות, אוסף פרטים וקובע תורים. העסק בסרטון מומצא.'},
  }},
  anim:{label:'אנימציה', color:'#c58bff', items:{
    motion:{title:'Motion Studio', lead:'שואוריל שנבנה כולו בסטודיו: חמישה סגנונות מתוך עשרה, עם עברית מימין לשמאל, מרונדרים פריים אחרי פריים.'},
    motionbiz:{title:'מושן גרפיקס לעסקים', lead:'פתיח של 15 שניות לעסק מומצא, "קפה הים", כמו שמקבלים בהזמנה. 15 שניות: 1,000 ₪ · 30 שניות: 1,450 ₪ (לא כולל מע״מ).'},
  }},
};
const nav = $('#nav'), stage = $('#stage'), flat = {};
for (const g of Object.values(DEMOS)){
  const row = document.createElement('div'); row.className = 'grp'; row.style.setProperty('--gc', g.color);
  const b = document.createElement('b'); b.textContent = g.label; row.append(b);
  for (const [k, d] of Object.entries(g.items)){
    flat[k] = Object.assign(d, {color:g.color});
    const btn = document.createElement('button'); btn.dataset.k = k; btn.textContent = d.title; btn.addEventListener('click', () => { history.replaceState(null, '', '#' + k); show(k); }); row.append(btn);
  }
  nav.append(row);
}
function show(k){
  const d = flat[k] || flat.tzameret; if (!flat[k]) k = 'tzameret';
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.k === k ? 'true' : 'false'));
  stage.style.setProperty('--sc', d.color); stage.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = d.title;
  const p = document.createElement('p'); p.className = 'lead'; p.textContent = d.lead;
  const v = document.createElement('video'); v.controls = true; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
  v.poster = `videos/${k}.jpg`; v.src = `videos/${k}.mp4`;
  stage.append(h, p, v); v.play().catch(() => {});
  if (d.cta){ const c = document.createElement('a'); c.className = 'cta'; c.href = d.cta.url; c.target = '_blank'; c.rel = 'noopener noreferrer'; c.textContent = d.cta.label; stage.append(c); }
}
addEventListener('hashchange', () => show(location.hash.slice(1)));
show((location.hash || '').slice(1));
})();
</script>
</body></html>
